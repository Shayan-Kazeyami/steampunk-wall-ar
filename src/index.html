<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>JZ Light Show · Driveway</title>
  <meta name="description" content="Bring Driveway to life with moving steampunk machinery, glowing brass and drifting steam.">
  <meta name="theme-color" content="#10120f">
  <link rel="preload" href="assets/full-wall/driveway-adaptive.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous">
  <script defer crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script defer src="bundle.js?v=__APP_VERSION__"></script>

  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" defer crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1.0.0/dist/landing-page.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" defer crossorigin="anonymous"></script>
</head>
<body style="margin:0;width:100%;height:100%;background:#15120f;overflow:hidden">
<section id="startup-fallback" style="position:relative;z-index:10000;max-width:34rem;margin:8vh auto;padding:24px;color:#f5eadb;background:#15120f;font:18px/1.5 sans-serif"><h1>JZ Light Show · Driveway</h1><p id="startup-message" role="status">The interactive wall needs JavaScript and WebGL graphics. If it does not start, try another browser or device.</p><p>AR and camera-free animation both need WebGL. You can still view the target artwork.</p><a style="color:#ffb547" href="./assets/driveway-sample.html">View or print the Driveway target artwork</a><p><button id="startup-retry" type="button" hidden style="min-height:44px;font:inherit">Reload viewer</button></p></section>
<div id="ui" style="position:fixed;inset:0;z-index:5;pointer-events:none"></div>
<template id="scene-template">
<a-scene embedded renderer="colorManagement:true;antialias:true;precision:high;maxCanvasWidth:4096;maxCanvasHeight:4096" style="position:fixed;inset:0;width:100%;height:100%" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" steampunk-coordinator>
<a-camera id="main-camera" position="0 0 2" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
<a-light type="ambient" intensity="0.8"></a-light><a-light type="directional" intensity="1" position="1 2 3"></a-light>
</a-scene></template></body></html>
