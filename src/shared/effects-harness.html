<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Effects contract checks</title>
<script src="/external/scripts/8frame-1.5.0.min.js" crossorigin="anonymous"></script>
</head><body><h1>Effects contract checks — no AR tracking</h1><pre id="results">Running…</pre>
<script type="module">
import {runEffectsContractChecks} from '../effects/evidence/contract-check.js';
try {
  const spec = await (await fetch('./spec.json')).json();
  const result = runEffectsContractChecks({THREE: AFRAME.THREE, spec});
  document.querySelector('#results').textContent = JSON.stringify(result, null, 2);
  document.title = 'Effects checks complete';
} catch (error) {
  document.querySelector('#results').textContent = 'FAIL: ' + error.stack;
  document.title = 'Effects checks failed';
}
</script></body></html>
