<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Private Right Garage five-family lamp review</title>
<style>html,body{margin:0;height:100%;background:#171b20;color:#fff;font:14px system-ui}a-scene{position:fixed!important;inset:0}#status{position:fixed;z-index:4;top:8px;left:12px;max-width:650px}</style>
<script src="../../runtime/8frame-1.5.0.min.js"></script><script src="../../runtime/environment-lighting.js"></script>
<p id="status">Private Right five-family source-assigned lamp preview. Emission surface output retained; GI, solid glass and phone acceptance remain open.</p>
<a-scene embedded renderer="colorManagement:true;antialias:true" background="color:#171b20" vr-mode-ui="enabled:false"><a-camera look-controls="enabled:false" wasd-controls="enabled:false"></a-camera><a-light type="ambient" intensity="0.3"></a-light><a-light type="directional" intensity="2.5" position="-1 2 1"></a-light></a-scene>
<script type="module">
import {validateLampContract} from './lamp-contract.mjs';
import {applyGlassContract} from '../../continuation-12/garage-glass/glass-contract.mjs';
import {applyBulbShadowContract} from '../../continuation-9/garage-bulbs/shadow-contract.mjs';
const scene=document.querySelector('a-scene'),status=document.querySelector('#status');
async function start(){try{
 const pins=await(await fetch('./assembly-pins.json')).json();for(const [url,pin]of Object.entries(pins)){const bytes=await(await fetch(url)).arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==pin)throw Error('Assembly artifact hash mismatch '+url)}
 const T=AFRAME.THREE,manifest=await(await fetch('runtime-manifest.json')).json(),doc=await(await fetch('right-lamp-materials.gltf')).json(),loader=new T.GLTFLoader(),g=await loader.loadAsync('right-lamp-materials.gltf');
 const supported=[...new Set([...Object.keys(g.parser.extensions||{}),...Object.keys(g.parser.plugins||{})])];const contract=validateLampContract(g.scene,manifest,supported);scene.object3D.add(g.scene);
 const bulbManifest=(await(await fetch('../../continuation-9/garage-bulbs/SOURCE_SUBSET_RESULT.json')).json()).walls.find(w=>w.stem==='06_GARAGE_R'),glassManifest=await(await fetch('../../continuation-12/garage-glass/PLAN.json')).json();const bulbs=await loader.loadAsync('../../continuation-9/garage-bulbs/06_GARAGE_R-source-bulb-subset.glb'),glass=await loader.loadAsync('../../continuation-12/garage-glass/right-glass.gltf');const support=o=>[...new Set([...Object.keys(o.parser.extensions||{}),...Object.keys(o.parser.plugins||{})])];const bulbContract=applyBulbShadowContract(bulbs.scene,bulbManifest,support(bulbs)),glassContract=applyGlassContract(glass.scene,glassManifest,support(glass));scene.object3D.add(bulbs.scene);scene.object3D.add(glass.scene);const groups={bulb:bulbs.scene,glass:glass.scene};const alignment=[];for(const row of manifest.rows){const familyObjects=[];for(const group of [g.scene,bulbs.scene,glass.scene])group.traverse(o=>{if(o.isMesh&&o.userData.ar_source_component===row.source)familyObjects.push(o)});if(familyObjects.length!==5)throw Error('Missing family');for(const o of familyObjects)o.updateWorldMatrix(true,false);const origins=familyObjects.map(o=>new T.Vector3().setFromMatrixPosition(o.matrixWorld));const error=Math.max(...origins.map(v=>v.distanceTo(origins[0])));if(error>2e-6)throw Error('Source origin alignment');alignment.push({source:row.source,families:5,world_origin_max:error})}window.assembly={pins,bulbContract,glassContract,alignment,bulbs,glass,groups};
 scene.renderer.toneMapping=T.ACESFilmicToneMapping;scene.renderer.toneMappingExposure=1;const env=createEnvironmentLighting({THREE:T,scene:scene.object3D,renderer:scene.renderer,url:'../../runtime/studio_small_09_1k.hdr'});await env.ready;env.setIntensity(.6);
 const canvas=document.createElement('canvas');canvas.width=canvas.height=256;const ctx=canvas.getContext('2d');for(let y=0;y<8;y++)for(let x=0;x<8;x++){ctx.fillStyle=(x+y)%2?'#3355aa':'#d5bd62';ctx.fillRect(x*32,y*32,32,32)}const map=new T.CanvasTexture(canvas);map.colorSpace=T.SRGBColorSpace;const stage=new T.Mesh(new T.PlaneGeometry(1.2,1.2),new T.MeshBasicMaterial({map,side:T.DoubleSide}));stage.rotation.x=-Math.PI/2;stage.position.y=-.02;scene.object3D.add(stage);
 const box=new T.Box3().setFromObject(g.scene),center=box.getCenter(new T.Vector3());scene.querySelector('a-camera').object3D.position.set(center.x,center.y+1.35,center.z);scene.camera.up.set(0,0,-1);scene.camera.lookAt(center);scene.camera.updateProjectionMatrix();scene.play();
 const meshes=[];g.scene.traverse(o=>{if(o.isMesh)meshes.push(o)});const context=scene.renderer.getContext(),debug=context.getExtension('WEBGL_debug_renderer_info');window.review={g,manifest,doc,contract,meshes,validateLampContract,supportedExtensions:supported,scene,env,render:()=>scene.renderer.render(scene.object3D,scene.camera),focusFirst:()=>{const b=new T.Box3().setFromObject(meshes[0]),c=b.getCenter(new T.Vector3()),size=b.getSize(new T.Vector3()),distance=Math.max(size.x,size.z)/(2*Math.tan(scene.camera.fov*Math.PI/360))*1.5;scene.querySelector('a-camera').object3D.position.set(c.x,c.y+distance,c.z);scene.camera.up.set(0,0,-1);scene.camera.lookAt(c);scene.camera.updateProjectionMatrix();map.wrapS=map.wrapT=T.RepeatWrapping;map.repeat.set(20,20);map.needsUpdate=true;return{source:meshes[0].userData.ar_source_component,scope:'One source-assigned lamp material close view; all48 family meshes remain loaded and validated',distance,bounds:[b.min.toArray(),b.max.toArray()]}}};
 const diagnostics={status:'READY',contract,meshes:meshes.length,triangles:meshes.reduce((s,o)=>s+o.geometry.index.count/3,0),materials:new Set(meshes.map(o=>o.material.uuid)).size,glRenderer:context.getParameter(debug?debug.UNMASKED_RENDERER_WEBGL:context.RENDERER),supportedExtensions:supported,castShadow:meshes.map(o=>o.castShadow),material:{ior:meshes[0].material.ior,transmission:meshes[0].material.transmission,roughness:meshes[0].material.roughness,color:meshes[0].material.color.toArray()}};const allMeshes=[];for(const group of [g.scene,bulbs.scene,glass.scene])group.traverse(o=>{if(o.isMesh)allMeshes.push(o)});const familyCounts={};for(const o of allMeshes){const f=o.userData.ar_source_subset.replace('historical_source_material:','');familyCounts[f]=(familyCounts[f]||0)+1}diagnostics.assembly={sourceObjects:new Set(allMeshes.map(o=>o.userData.ar_source_component)).size,families:Object.keys(familyCounts).length,meshes:allMeshes.length,familyCounts,totalTriangles:allMeshes.reduce((n,o)=>n+(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3,0),uniqueGeometryObjects:new Set(allMeshes.map(o=>o.geometry.uuid)).size,uniqueMaterials:new Set(allMeshes.map(o=>o.material.uuid)).size,alignment:window.assembly.alignment,bulbContract:window.assembly.bulbContract,glassContract:window.assembly.glassContract};window.review.diagnostics=diagnostics;window.review.render();status.dataset.ready=JSON.stringify(diagnostics);status.textContent='Private five-family lamp materials: 16 source lamps / plastic, Emission, silver. Camera-branch mapping only; no GI or phone approval.';
}catch(e){status.dataset.error=String(e);console.error(e)}}
if(document.readyState==='complete')start();else window.addEventListener('load',start,{once:true});
</script>
